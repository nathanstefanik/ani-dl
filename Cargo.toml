[package]
name = "ani-dl"
version = "0.2.0"
edition = "2021"
description = "Rust CLI for downloading anime (ani-cli UX, no playback, no ffmpeg)"

[[bin]]
name = "ani-dl"
path = "src/main.rs"

[[bin]]
name = "ani-dl-minter"
path = "src/bin/ani-dl-minter.rs"

[dependencies]
async-trait = "0.1"
aes-gcm = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "time", "signal", "process", "net"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.27"
crossterm = "0.27"
m3u8-rs = "6"
aes = "0.8"
ctr = "0.9"
cbc = { version = "0.1", features = ["alloc"] }
hex = "0.4"
base64 = "0.22"
futures = "0.3"
indicatif = "0.17"
anyhow = "1"
toml = "0.8"
dirs = "5"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
bytes = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
