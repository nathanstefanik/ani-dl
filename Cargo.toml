[package]
name = "ani-dl"
version = "0.4.0"
edition = "2024"
description = "Rust CLI for downloading anime (ani-cli UX, anidb.app backend, no playback)"

[[bin]]
name = "ani-dl"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "time", "signal", "process", "net"] }
wreq = { version = "5", default-features = true, features = ["json", "stream", "gzip", "cookies"] }
wreq-util = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.27"
crossterm = "0.27"
m3u8-rs = "6"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hex = "0.4"
futures = "0.3"
indicatif = "0.17"
anyhow = "1"
toml = "0.8"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
bytes = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
